name: Contract test xr-voice-sdk HTTP protocol (Prism)

on:
  pull_request:
    branches: [ main, 'sprint/**', 'release/**', topic/RDK*, 'feature/**', develop ]

permissions:
  contents: read

jobs:
  contract-test-http:
    name: VREX HTTP contract test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: build dependencies
        run: |
          sh -x ci/build_dependencies.sh

      - name: contract test
        run: |
          bash ci/contract_test.sh
